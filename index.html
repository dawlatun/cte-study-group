<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>準教師戰鬥營 - 教資教甄線上讀書會系統</title>
  
  <!-- 載入 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 載入 Tailwind CSS 與 FontAwesome 圖示 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 分頁顯示邏輯 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 仿教育部教資試卷：每行 32px 橫線 */
    .exam-ruled-lines {
      background-image: linear-gradient(transparent 31px, #334155 32px);
      background-size: 100% 32px;
      line-height: 32px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- 頂部功能導覽列 -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-30 shadow-md">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('bulletin')">
      <div class="bg-indigo-600 text-white p-2 rounded-lg text-lg font-bold shadow-md">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
          準教師戰鬥營 
          <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded">教資教甄讀書會</span>
        </h1>
        <p class="text-xs text-slate-400">雙向互助學習・智慧出題與研討系統</p>
      </div>
    </div>

    <!-- 導航分頁按鈕 -->
    <nav class="flex items-center gap-1.5 text-xs font-semibold overflow-x-auto py-1">
      <button id="nav-bulletin" onclick="switchTab('bulletin')" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white transition">
        <i class="fa-solid fa-bullhorn mr-1"></i>布告欄
      </button>
      <button id="nav-members" onclick="switchTab('members')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-users mr-1"></i>準教師會
      </button>
      <button id="nav-ebook" onclick="switchTab('ebook')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-book-open mr-1"></i>電子書
      </button>
      <button id="nav-exam" onclick="switchTab('exam')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-pencil mr-1"></i>超會考
      </button>
    </nav>

    <!-- 登入狀態控制區 -->
    <div id="auth-container" class="flex items-center space-x-2 text-xs">
      <button id="btn-login" onclick="loginWithGoogle()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition flex items-center gap-1.5 shadow">
        <i class="fa-brands fa-google"></i> Google 登入
      </button>

      <div id="user-info" class="hidden flex items-center space-x-3">
        <img id="user-avatar" src="" alt="avatar" class="w-7 h-7 rounded-full border border-indigo-400">
        <div class="text-left hidden sm:block">
          <div id="user-name" class="font-bold text-slate-200 leading-tight">--</div>
          <div id="user-badge" class="text-[10px] text-amber-400 font-bold">待審核</div>
        </div>
        <button onclick="logout()" class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-[11px] transition">
          登出
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="relative min-h-[500px] flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">

    <!-- 待審核權限鎖定提示遮罩 (預設隱藏 hidden) -->
    <div id="pending-lock-overlay" class="hidden absolute inset-0 z-40 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center rounded-xl border border-amber-500/30">
      <div class="w-16 h-16 rounded-full bg-amber-500/10 border border-amber-500/40 flex items-center justify-center text-amber-400 text-2xl mb-4 shadow-lg shadow-amber-500/10 animate-pulse">
        <i class="fa-solid fa-user-clock"></i>
      </div>
      <h3 id="overlay-title" class="text-xl font-bold text-slate-100 mb-2">身分資格審核中</h3>
      <p id="overlay-desc" class="text-sm text-slate-400 max-w-md leading-relaxed mb-6">
        歡迎加入準教師戰鬥營！您目前的身分為 <span class="text-amber-400 font-semibold font-mono">待審核 (pending)</span>。<br>
        為確保讀書會社群與命題品質，核心試題庫、電子書與互動功能需待管理團隊確認教育學程身分後開通。
      </p>
      <div class="flex items-center gap-3">
        <button onclick="switchTab('bulletin')" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> 回到車站布告欄
        </button>
        <a href="https://line.me" target="_blank" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow transition flex items-center gap-2">
          <i class="fa-brands fa-line"></i> 聯繫管理員審核
        </a>
      </div>
    </div>

    <!-- 模組 1：布告欄（車站電子時刻表風格） -->
    <section id="tab-bulletin" class="tab-content active space-y-4">
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-black tracking-wider text-amber-400 flex items-center gap-2">
            ★ 準教師戰鬥營 ★ 每日重要公告板
          </h2>
          <p class="text-xs text-slate-400 mt-1 font-mono
